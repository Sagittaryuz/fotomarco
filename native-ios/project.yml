name: Momentra
options:
  bundleIdPrefix: br.com.momentra
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.1'
    CURRENT_PROJECT_VERSION: '2'
targets:
  Momentra:
    type: application
    platform: iOS
    sources: [Momentra]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.momentra.camera
        PRODUCT_NAME: Momentra
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 'A câmera é necessária para fotografar e gravar vídeos.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'O microfone é necessário para gravar áudio nos vídeos.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'A localização é usada no carimbo quando você ativa o GPS.'
        INFOPLIST_KEY_NSMotionUsageDescription: 'O sensor de pressão é usado no carimbo quando você ativa essa opção.'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Permite salvar fotos e vídeos na biblioteca.'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
  MomentraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MomentraTests]
    dependencies:
      - target: Momentra
schemes:
  Momentra:
    build:
      targets:
        Momentra: all
        MomentraTests: [test]
    test:
      targets: [MomentraTests]
