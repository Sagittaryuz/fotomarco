name: Fotomarco
options:
  bundleIdPrefix: br.com.momentra
  deploymentTarget:
    iOS: '17.0'
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.0.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.43'
    CURRENT_PROJECT_VERSION: '64'
targets:
  Momentra:
    type: application
    platform: iOS
    sources: [Momentra]
    info:
      path: Configuration/MomentraInfo.plist
      properties:
        CFBundleDisplayName: Fotomarco
        BGTaskSchedulerPermittedIdentifiers:
          - br.com.momentra.camera.cloud-processing
        UIBackgroundModes:
          - processing
        MomentraInstallerHost: '$(MOMENTRA_INSTALLER_HOST)'
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: MomentraCaptureExtension
        embed: true
      - target: MomentraCameraControl
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.momentra.camera
        PRODUCT_NAME: Momentra
        MOMENTRA_INSTALLER_HOST: momentra-atualizacoes.mrpires72.workers.dev
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: 'MomentraIcon1 MomentraIcon2 MomentraIcon3 MomentraIcon4 MomentraIcon5 MomentraIcon6 MomentraIcon7 MomentraIcon8 MomentraIconOriginal'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 'A câmera é necessária para fotografar e gravar vídeos.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'O microfone é necessário para gravar áudio nos vídeos.'
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 'A localização é usada no carimbo quando você ativa o GPS. Para a previsão, o Fotomarco consulta a MET Norway com coordenadas aproximadas.'
        INFOPLIST_KEY_NSMotionUsageDescription: 'O sensor de pressão é usado no carimbo quando você ativa essa opção.'
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 'Permite salvar fotos e vídeos na biblioteca.'
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 'Permite visualizar as fotos escolhidas e criar cópias com carimbo.'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait'
  MomentraCaptureExtension:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - MomentraCaptureExtension
      - path: Momentra/CameraPreview.swift
      - path: Momentra/HapticSettings.swift
      - path: Momentra/MomentraCaptureIntent.swift
      - path: Momentra/CloudDeliveryPlan.swift
      - path: Momentra/LockedCaptureMetadata.swift
      - path: Momentra/StampRenderer.swift
      - path: Momentra/StampLayout.swift
      - path: Momentra/PressureService.swift
      - path: Momentra/ForecastModel.swift
      - path: Momentra/ZoomScale.swift
    info:
      path: MomentraCaptureExtension/Info.plist
      properties:
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSLocationWhenInUseUsageDescription: 'A localização é usada no carimbo quando você ativa o GPS.'
        NSPhotoLibraryAddUsageDescription: 'Permite salvar fotos na biblioteca.'
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.momentra.camera.capture
        PRODUCT_NAME: MomentraCaptureExtension
        SKIP_INSTALL: YES
  MomentraCameraControl:
    type: app-extension
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - MomentraCameraControl
      - path: Momentra/MomentraCaptureIntent.swift
      - path: Momentra/CloudDeliveryPlan.swift
    info:
      path: MomentraCameraControl/Info.plist
      properties:
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.momentra.camera.control
        PRODUCT_NAME: MomentraCameraControl
        SKIP_INSTALL: YES
  MomentraTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MomentraTests]
    dependencies:
      - target: Momentra
schemes:
  Momentra:
    build:
      targets:
        Momentra: all
        MomentraTests: [test]
    test:
      targets: [MomentraTests]
