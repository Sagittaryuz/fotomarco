name: Focused gallery progress validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  focused-test:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate project
        working-directory: native-ios
        run: xcodegen generate
      - name: Test cloud progress
        working-directory: native-ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          xcodebuild -jobs 2 -project Fotomarco.xcodeproj -scheme Momentra -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/focused" -resultBundlePath "$RUNNER_TEMP/focused.xcresult" -only-testing:MomentraTests/CloudUploadProgressTests CODE_SIGNING_ALLOWED=NO -quiet test
      - name: Summarize
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/focused.xcresult" ]; then xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/focused.xcresult"; fi
