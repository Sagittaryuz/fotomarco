name: Verify Business deployment credential
on:
  workflow_dispatch:
    inputs:
      metadata_only:
        description: Inspect deployed version without creating test accounts
        type: boolean
        default: false
  push:
    branches: [feat/business-organizations-foundation]
    paths: [.github/workflows/business-token-check.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token without displaying it
        env:
          CF_TOKEN: ${{ secrets.PHOTOMARK_BUSINESS_WORKER_TOKEN }}
        run: |
          test -n "$CF_TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -e '.success == true and .result.status == "active"' > /dev/null
          echo 'Cloudflare token is active.'
      - name: Check target account and existing Business Worker
        env:
          CF_TOKEN: ${{ secrets.PHOTOMARK_BUSINESS_WORKER_TOKEN }}
        run: |
          accounts=$(curl --fail --silent --show-error -H "Authorization: Bearer $CF_TOKEN" 'https://api.cloudflare.com/client/v4/accounts?per_page=50')
          account_id=$(echo "$accounts" | jq -er 'select(.success == true) | .result | if length == 1 then .[0].id else error("Expected exactly one accessible account") end')
          scripts=$(curl --fail --silent --show-error -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts?per_page=100")
          echo "$scripts" | jq -e '.success == true and (.result | type == "array")' > /dev/null
          echo "$scripts" | jq -r 'if any(.result[]; .id == "photomark-business") then "Business Worker already exists; inspect it before deployment." else "Business Worker is not present in this account." end'
      - name: Check staging binding names without displaying values
        env:
          CF_TOKEN: ${{ secrets.PHOTOMARK_BUSINESS_WORKER_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const headers = { authorization: `Bearer ${process.env.CF_TOKEN}` };
          const get = async path => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers });
            if (!response.ok) throw new Error(`Cloudflare metadata request returned HTTP ${response.status}`);
            const body = await response.json();
            if (!body.success) throw new Error('Cloudflare metadata request failed');
            return body.result;
          };
          const accounts = await get('/accounts?per_page=50');
          if (accounts.length !== 1) throw new Error('Expected one accessible account');
          const settings = await get(`/accounts/${accounts[0].id}/workers/scripts/photomark-business-staging/settings`);
          const names = new Set((settings.bindings ?? []).map(binding => binding.name));
          for (const name of ['BUSINESS_MICROSOFT_CLIENT_ID', 'BUSINESS_CREDENTIAL_KEY', 'BUSINESS_SERVER_EMAIL', 'BUSINESS_SERVER_PRIVATE_KEY']) {
            console.log(`${name}: ${names.has(name) ? 'configured' : 'missing'}`);
          }
          NODE
      - name: Inspect active staging deployment metadata
        env:
          CF_TOKEN: ${{ secrets.PHOTOMARK_BUSINESS_WORKER_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const headers = { authorization: `Bearer ${process.env.CF_TOKEN}` };
          const get = async path => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers });
            if (!response.ok) throw Error(`Metadata request returned HTTP ${response.status}`);
            const body = await response.json();
            if (!body.success) throw Error('Metadata request failed');
            return body.result;
          };
          const accounts = await get('/accounts?per_page=50');
          if (accounts.length !== 1) throw Error('Expected one accessible account');
          const data = await get(`/accounts/${accounts[0].id}/workers/scripts/photomark-business-staging/deployments`);
          const latest = data.deployments?.[0];
          if (!latest || !Array.isArray(latest.versions)) throw Error('Missing active deployment metadata');
          console.log(JSON.stringify({ created_on: latest.created_on, source: latest.source,
            versions: latest.versions.map(({ version_id, percentage }) => ({ version_id, percentage })) }));
          NODE
      - name: Verify isolated Firestore service identity
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PHOTOMARK_BUSINESS_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import { createSign } from 'node:crypto';
          const key = JSON.parse(process.env.SERVICE_ACCOUNT_JSON || '{}');
          if (key.project_id !== 'photomark-business-2026' || key.client_email !== 'photomark-business-api@photomark-business-2026.iam.gserviceaccount.com') throw Error('Unexpected service identity');
          const b64 = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const input = `${b64({alg:'RS256',typ:'JWT'})}.${b64({iss:key.client_email,scope:'https://www.googleapis.com/auth/datastore',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+300})}`;
          const signature = createSign('RSA-SHA256').update(input).sign(key.private_key, 'base64url');
          const response = await fetch('https://oauth2.googleapis.com/token', {method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion:`${input}.${signature}`})});
          if (!response.ok) throw Error(`Identity exchange failed: HTTP ${response.status}`);
          const {access_token} = await response.json();
          const check = await fetch('https://firestore.googleapis.com/v1/projects/photomark-business-2026/databases/(default)/documents/photomark_validation/nonexistent', {headers:{authorization:`Bearer ${access_token}`}});
          if (![200,404].includes(check.status)) throw Error(`Firestore check failed: HTTP ${check.status}`);
          console.log('Isolated service identity can access Firestore.');
          NODE
      - name: Check staging access control
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' -X POST https://photomark-business-staging.mrpires72.workers.dev/v1/organizations/mine)
          echo "Staging anonymous request HTTP $status"
          test "$status" = 401
      - uses: actions/checkout@v4
      - name: Test isolated identities against staging
        if: ${{ !inputs.metadata_only }}
        env:
          FIREBASE_CONFIG: ${{ secrets.PHOTOMARK_FIREBASE_IOS_CONFIG }}
        run: |
          export FIREBASE_API_KEY=$(python3 -c 'import os,plistlib; print(plistlib.loads(os.environ["FIREBASE_CONFIG"].encode())["API_KEY"])')
          echo "::add-mask::$FIREBASE_API_KEY"
          node backend/business-staging-identity-check.mjs
