name: Audit Business staging bindings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check required binding names without reading secret values
        env:
          CF_TOKEN: ${{ secrets.PHOTOMARK_BUSINESS_WORKER_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CF_TOKEN;
          if (!token) throw new Error('Missing deployment credential');
          const headers = { authorization: `Bearer ${token}` };
          const get = async path => {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers });
            if (!response.ok) throw new Error(`Cloudflare metadata request returned HTTP ${response.status}`);
            const data = await response.json();
            if (!data.success) throw new Error('Cloudflare metadata request failed');
            return data.result;
          };
          const accounts = await get('/accounts?per_page=50');
          if (accounts.length !== 1) throw new Error('Expected one accessible account');
          const settings = await get(`/accounts/${accounts[0].id}/workers/scripts/photomark-business-staging/settings`);
          const bindings = new Map((settings.bindings ?? []).map(({ name, type }) => [name, type]));
          for (const name of ['BUSINESS_MICROSOFT_CLIENT_ID', 'BUSINESS_CREDENTIAL_KEY', 'BUSINESS_SERVER_EMAIL', 'BUSINESS_SERVER_PRIVATE_KEY']) {
            console.log(`${name}: ${bindings.has(name) ? 'configured' : 'missing'}`);
          }
          NODE
