name: Validate Momentra gallery interactions
on:
  workflow_dispatch:
    inputs:
      signing_candidate:
        type: boolean
        default: false
      test_method:
        description: Optional single GalleryInteractionTests method
        type: string
        default: ''
permissions:
  contents: read
jobs:
  gallery-ui:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate project and start simulator
        working-directory: native-ios
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Install fixture captures
        working-directory: native-ios
        run: |
          xcodebuild -project Momentra.xcodeproj -scheme Momentra -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/gallery" CODE_SIGNING_ALLOWED=NO -quiet build-for-testing
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/gallery/Build/Products/Debug-iphonesimulator/Momentra.app"
          xcrun simctl privacy "$DEVICE" grant all br.com.momentra.camera
          xcrun simctl privacy "$DEVICE" grant photos br.com.momentra.camera
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" br.com.momentra.camera data)
          mkdir -p "$CONTAINER/Documents/Originals"
          for number in 1 2 3; do
            sips -s format jpeg "Momentra/Assets.xcassets/AppIcon.appiconset/Light.png" --out "$CONTAINER/Documents/Originals/00000000-0000-0000-0000-00000000000$number.jpg" >/dev/null
          done
          xcrun simctl addmedia "$DEVICE" "$CONTAINER/Documents/Originals/00000000-0000-0000-0000-000000000003.jpg"
      - name: Exercise gallery and support panel
        working-directory: native-ios
        env:
          TEST_METHOD: ${{ inputs.test_method }}
        run: |
          TEST_TARGET="MomentraUITests/GalleryInteractionTests${TEST_METHOD:+/$TEST_METHOD}"
          xcodebuild -project Momentra.xcodeproj -scheme Momentra -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/gallery" -resultBundlePath "$RUNNER_TEMP/Gallery.xcresult" -parallel-testing-enabled NO "-only-testing:$TEST_TARGET" CODE_SIGNING_ALLOWED=NO -quiet test-without-building
      - name: Export evidence
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/Gallery.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Gallery.xcresult"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Gallery.xcresult" --output-path "$RUNNER_TEMP/gallery-attachments"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentra-gallery-interactions
          path: ${{ runner.temp }}/gallery-attachments/
          retention-days: 3
