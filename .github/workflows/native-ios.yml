name: Validate Momentra gallery interactions
on:
  workflow_dispatch:
    inputs:
      signing_candidate:
        type: boolean
        default: false
      test_method:
        description: GalleryInteractionTests method, sharing, cameraGallery, or cameraExperience
        type: string
        default: ''
      baseline_gallery:
        description: Measure the published 0.1.18 under the same simulator fixtures
        type: boolean
        default: false
      candidate_sha:
        description: Revision of app code under test
        type: string
        default: ''
permissions:
  contents: read
jobs:
  gallery-ui:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use Momentra 0.1.18 app code for the baseline
        if: inputs.baseline_gallery
        run: |
          BASELINE=ec95ea616568437c6494edb49dfbdc21cb340743
          git fetch --depth=1 origin "$BASELINE"
          git restore --source="$BASELINE" --worktree -- native-ios/Momentra native-ios/MomentraCaptureExtension native-ios/MomentraTests
      - name: Use the exact app candidate
        if: inputs.candidate_sha != '' && !inputs.baseline_gallery
        env:
          CANDIDATE: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=1 origin "$CANDIDATE"
          git restore --source="$CANDIDATE" --worktree -- native-ios/Momentra native-ios/MomentraCaptureExtension native-ios/MomentraTests native-ios/MomentraCameraControl
          python3 - <<'PYTHON'
          import re, subprocess
          from pathlib import Path
          project = Path("native-ios/project.yml")
          candidate = subprocess.check_output(["git", "show", "FETCH_HEAD:native-ios/project.yml"], text=True)
          pattern = r"^    (?:MARKETING_VERSION|CURRENT_PROJECT_VERSION): .*$"
          replacements = iter(re.findall(pattern, candidate, re.M))
          project.write_text(re.sub(pattern, lambda _: next(replacements), project.read_text(), flags=re.M))
          PYTHON
      - name: Add simulator-only PhotoKit fixtures for the comparison
        if: inputs.test_method == 'testGalleryCatalogMeasurement'
        shell: bash
        run: |
          cp .github/qa/GalleryBenchmarkFixture.swift native-ios/Momentra/GalleryBenchmarkFixture.swift
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("native-ios/Momentra/CameraScreen.swift")
          source = p.read_text()
          previous = "        .task { await updates.check() }"
          assert source.count(previous) == 1
          p.write_text(source.replace(previous, previous + "\n        .modifier(GalleryBenchmarkFixture())", 1))
          PYTHON
      - name: Add simulator-only offline cloud catalog fixture
        if: inputs.test_method == 'testCloudCatalogSurvivesAppRelaunch' || inputs.test_method == 'cameraGallery'
        run: |
          cp .github/qa/CloudCatalogFixture.swift native-ios/Momentra/CloudCatalogFixture.swift
          python3 - <<'PYTHON'
          from pathlib import Path
          camera = Path("native-ios/Momentra/CameraScreen.swift")
          source = camera.read_text()
          anchor = "        .onAppear {\n            if !addressPreviewMigrated {"
          assert source.count(anchor) == 1
          camera.write_text(source.replace(anchor, "        .modifier(CloudCatalogFixture())\n" + anchor, 1))
          accounts = Path("native-ios/Momentra/CloudArchiveAccounts.swift")
          with accounts.open("a") as file:
              file.write("""
          extension CloudArchiveAccounts {
              func installCloudCatalogFixture(_ destination: CloudDeliveryPlan.Destination) {
                  accounts = [Account(id: destination, label: "Conta de teste", enabled: false)]
              }
          }
          """)
          summary = Path("native-ios/Momentra/GalleryStorageSummary.swift")
          source = summary.read_text()
          anchor = "    private static func fetchQuota(for destination: CloudDeliveryPlan.Destination) async -> CloudQuota? {"
          assert source.count(anchor) == 1
          summary.write_text(source.replace(anchor, anchor + """
                  if ProcessInfo.processInfo.arguments.contains("-galleryCloudFixture") {
                      try? await Task.sleep(for: .seconds(8))
                      return nil
                  }
          """, 1))
          PYTHON
      - name: Add simulator-only camera and updater fixtures
        if: inputs.test_method == 'cameraExperience'
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          def replace(name, before, after):
              p = Path("native-ios/Momentra") / name
              source = p.read_text()
              assert source.count(before) == 1, name
              p.write_text(source.replace(before, after))

          replace("CameraScreen.swift",
              "} else if !camera.zoomOptions.isEmpty {\n                        CameraZoomStrip(presets: camera.zoomOptions, zoom: camera.zoomFactor, shutterCenterX: shutterCenterX)",
              """} else if !camera.zoomOptions.isEmpty || UserDefaults.standard.string(forKey: "qaCameraZoom") != nil {
                                  let sample = UserDefaults.standard.string(forKey: "qaCameraZoom").flatMap(Double.init)
                                  CameraZoomStrip(presets: sample == nil ? camera.zoomOptions : [0.5, 1, 2, 4, 8], zoom: sample.map { CGFloat($0) } ?? camera.zoomFactor, shutterCenterX: shutterCenterX)""")
          replace("UpdateService.swift", "    func check() async {",
              """    private var simulatedChecks = 0
              func check() async {
                  if ProcessInfo.processInfo.arguments.contains("-qaUpdateFixture") {
                      simulatedChecks += 1
                      availableVersion = "9.9." + String(simulatedChecks)
                      return
                  }""")
          replace("DirectUpdateAccess.swift", "private init() { ready = Self.readToken() != nil }",
              'private init() { ready = Self.readToken() != nil || ProcessInfo.processInfo.arguments.contains("-qaUpdateFixture") }')
          replace("DirectUpdateAccess.swift",
              "    func install(expectedVersion: String, canClose: @escaping @MainActor () -> Bool) async {",
              """    func install(expectedVersion: String, canClose: @escaping @MainActor () -> Bool) async {
                  if ProcessInfo.processInfo.arguments.contains("-qaUpdateFixture") {
                      message = "Instalador solicitado para " + expectedVersion
                      return
                  }""")
          PYTHON
      - name: Generate project and start simulator
        working-directory: native-ios
        run: |
          python3 - <<'PYTHON'
          import re
          from pathlib import Path
          version = re.search(r"^    MARKETING_VERSION: '([^']+)'", Path("project.yml").read_text(), re.M).group(1)
          suite = Path("MomentraUITests/GalleryInteractionTests.swift")
          suite.write_text(re.sub(r'("-lastPresentedVersion", ")[^"]+(")', rf'\g<1>{version}\g<2>', suite.read_text()))
          PYTHON
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
      - name: Install fixture captures
        working-directory: native-ios
        env:
          TEST_METHOD: ${{ inputs.test_method }}
        run: |
          xcodebuild -project Momentra.xcodeproj -scheme Momentra -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/gallery" CODE_SIGNING_ALLOWED=NO -only-testing:MomentraUITests -quiet build-for-testing
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/gallery/Build/Products/Debug-iphonesimulator/Momentra.app"
          xcrun simctl privacy "$DEVICE" grant all br.com.momentra.camera
          xcrun simctl privacy "$DEVICE" grant photos br.com.momentra.camera
          if [ "$TEST_METHOD" = testStampEditorCanOpenPhotoAndFileSelectors ]; then exit 0; fi
          CONTAINER=$(xcrun simctl get_app_container "$DEVICE" br.com.momentra.camera data)
          mkdir -p "$CONTAINER/Documents/Originals"
          for number in 1 2 3; do
            sips -s format jpeg "Momentra/Assets.xcassets/AppIcon.appiconset/Light.png" --out "$CONTAINER/Documents/Originals/00000000-0000-0000-0000-00000000000$number.jpg" >/dev/null
          done
          if [ "$TEST_METHOD" = testCloudCatalogSurvivesAppRelaunch ]; then
            mkdir -p "$CONTAINER/Documents/CloudThumbnails"
            cp "$CONTAINER/Documents/Originals/00000000-0000-0000-0000-000000000001.jpg" "$CONTAINER/Documents/CloudThumbnails/00000000-0000-0000-0000-000000000010.jpg"
          fi
          if [ "$TEST_METHOD" = testCameraThumbnailSharesOnlyTheDisplayedPhoto ]; then
            mkdir -p "$CONTAINER/Documents/Processed"
            cp "$CONTAINER/Documents/Originals/00000000-0000-0000-0000-000000000003.jpg"               "$CONTAINER/Documents/Processed/00000000-0000-0000-0000-000000000003.jpg"
            exit 0
          fi
          if [ "$TEST_METHOD" = cameraGallery ]; then
            python3 - "$CONTAINER" <<'PYTHON'
          import json
          import os
          import plistlib
          import shutil
          import sys
          import time
          from pathlib import Path

          container = Path(sys.argv[1])
          originals = container / "Documents" / "Originals"
          source = originals / "00000000-0000-0000-0000-000000000003.jpg"
          now = time.time()
          for index in range(4, 28):
              old = originals / f"00000000-0000-0000-0000-{index:012d}.jpg"
              shutil.copyfile(source, old)
              os.utime(old, (now - 3 * 86400, now - 3 * 86400))
          processed = container / "Documents" / "Processed"
          processed.mkdir()
          shutil.copyfile(source, processed / source.name)
          trash = container / "Documents" / "CaptureTrash" / "Originals" / f"{int(now)}-qa"
          trash.mkdir(parents=True)
          keys = []
          for photo in originals.glob("*.jpg"):
              shutil.copy2(photo, trash / photo.name)
              keys.append(f"Originals/{photo.name}")
          prefs = container / "Library" / "Preferences" / "br.com.momentra.camera.plist"
          prefs.parent.mkdir(parents=True, exist_ok=True)
          values = plistlib.loads(prefs.read_bytes()) if prefs.exists() else {}
          values["native.gallery.favoriteCaptureKeys"] = json.dumps(keys).encode()
          prefs.write_bytes(plistlib.dumps(values, fmt=plistlib.FMT_BINARY))
          PYTHON
            exit 0
          fi
          if [ "$TEST_METHOD" = testVideoEditingOpensAStampedPreviewAndSavesACopy ] || [ "$TEST_METHOD" = cameraExperience ]; then
            command -v ffmpeg || brew install ffmpeg
            mkdir -p "$CONTAINER/Documents/Videos"
            ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=640x480:r=15 -t 1 -c:v libx264 -pix_fmt yuv420p "$CONTAINER/Documents/Videos/00000000-0000-0000-0000-000000000099.mov"
            exit 0
          fi
          if [ "$TEST_METHOD" = sharing ] || [ "$TEST_METHOD" = cameraExperience ]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/camera-roll"
          for number in $(seq 1 24); do
            sips -Z "$((256 + number * 8))" "$CONTAINER/Documents/Originals/00000000-0000-0000-0000-000000000003.jpg" --out "$RUNNER_TEMP/camera-roll/$number.jpg" >/dev/null
          done
          xcrun simctl addmedia "$DEVICE" "$RUNNER_TEMP"/camera-roll/*.jpg
          DATABASE=$(find "$HOME/Library/Developer/CoreSimulator/Devices/$DEVICE/data" -name Photos.sqlite -print -quit 2>/dev/null)
          if [ -n "$DATABASE" ]; then
            for attempt in {1..10}; do
              COUNT=$(sqlite3 -readonly "$DATABASE" "select count(*) from ZASSET" 2>/dev/null || true)
              if [ "${COUNT:-0}" -ge 24 ]; then break; fi
              sleep 2
            done
            echo "PhotoKit simulator fixture rows: ${COUNT:-unknown}"
          fi
      - name: Exercise gallery and support panel
        working-directory: native-ios
        env:
          TEST_METHOD: ${{ inputs.test_method }}
        run: |
          TEST_SUITE="MomentraUITests/GalleryInteractionTests"
          TEST_TARGETS=("-only-testing:$TEST_SUITE${TEST_METHOD:+/$TEST_METHOD}")
          if [ "$TEST_METHOD" = sharing ]; then
            TEST_TARGETS=(
              "-only-testing:$TEST_SUITE/testHoldingGalleryPhotoAutomaticallyOpensSystemShareSheet"
              "-only-testing:$TEST_SUITE/testViewerAddsNearbyPhotosToNativeShare"
              "-only-testing:$TEST_SUITE/testCompletedBatchShareExitsSelectionMode"
            )
          fi
          if [ "$TEST_METHOD" = cameraGallery ]; then
            TEST_TARGETS=(
              "-only-testing:$TEST_SUITE/testCameraThumbnailSharesOnlyTheDisplayedPhoto"
              "-only-testing:$TEST_SUITE/testGalleryGroupsCopyBadgesOnOneThumbnail"
              "-only-testing:$TEST_SUITE/testRetappingGalleryTabsReturnsToNewestDate"
            )
          fi
          if [ "$TEST_METHOD" = cameraExperience ]; then
            TEST_TARGETS=(
              "-only-testing:$TEST_SUITE/testIntermediateZoomReplacesTheLowerPresetAndCentersAboveShutter"
              "-only-testing:$TEST_SUITE/testUpdateBannerChecksAgainAndOpensInstallerDirectly"
              "-only-testing:$TEST_SUITE/testSupportPanelClosesOnOutsideTap"
              "-only-testing:$TEST_SUITE/testVideoEditingOpensAStampedPreviewAndSavesACopy"
            )
          fi
          SKIP_BENCHMARK=()
          if [ -z "$TEST_METHOD" ]; then
            SKIP_BENCHMARK=(-skip-testing:MomentraUITests/GalleryInteractionTests/testGalleryCatalogMeasurement -skip-testing:MomentraUITests/GalleryInteractionTests/testCloudCatalogSurvivesAppRelaunch -skip-testing:MomentraUITests/GalleryInteractionTests/testCameraThumbnailSharesOnlyTheDisplayedPhoto -skip-testing:MomentraUITests/GalleryInteractionTests/testGalleryGroupsCopyBadgesOnOneThumbnail -skip-testing:MomentraUITests/GalleryInteractionTests/testRetappingGalleryTabsReturnsToNewestDate -skip-testing:MomentraUITests/GalleryInteractionTests/testIntermediateZoomReplacesTheLowerPresetAndCentersAboveShutter -skip-testing:MomentraUITests/GalleryInteractionTests/testUpdateBannerChecksAgainAndOpensInstallerDirectly -skip-testing:MomentraUITests/GalleryInteractionTests/testVideoEditingOpensAStampedPreviewAndSavesACopy)
          fi
          xcodebuild -project Momentra.xcodeproj -scheme Momentra -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/gallery" -resultBundlePath "$RUNNER_TEMP/Gallery.xcresult" -parallel-testing-enabled NO "${TEST_TARGETS[@]}" "${SKIP_BENCHMARK[@]}" CODE_SIGNING_ALLOWED=NO -quiet test-without-building
      - name: Export evidence
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/Gallery.xcresult/Info.plist" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Gallery.xcresult"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Gallery.xcresult" --output-path "$RUNNER_TEMP/gallery-attachments"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentra-gallery-interactions
          path: ${{ runner.temp }}/gallery-attachments/
          retention-days: 3
