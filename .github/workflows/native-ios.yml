name: Validate native iOS draft
on:
  push:
    branches: [feat/native-ios, feat/native-camera-control, feat/native-direct-updates]
    paths: ['native-ios/**', '.github/workflows/native-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-package-check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate Xcode project
        working-directory: native-ios
        run: xcodegen generate
      - name: Compile unsigned app for iPhone
        working-directory: native-ios
        run: xcodebuild -project Momentra.xcodeproj -scheme Momentra -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/momentra-device" CODE_SIGNING_ALLOWED=NO build
      - name: Check unsigned IPA structure
        run: |
          APP="$RUNNER_TEMP/momentra-device/Build/Products/Release-iphoneos/Momentra.app"
          test -f "$APP/Info.plist"
          test -f "$APP/Momentra"
          if [ "$GITHUB_REF_NAME" = "feat/native-camera-control" ] || [ "$GITHUB_REF_NAME" = "feat/native-direct-updates" ]; then
            CAPTURE="$APP/Extensions/MomentraCaptureExtension.appex"
            CONTROL="$APP/PlugIns/MomentraCameraControl.appex"
            test -f "$CAPTURE/MomentraCaptureExtension"
            test -f "$CONTROL/MomentraCameraControl"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$CAPTURE/Info.plist")" = 'br.com.momentra.camera.capture'
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$CONTROL/Info.plist")" = 'br.com.momentra.camera.control'
            test "$(/usr/libexec/PlistBuddy -c 'Print :EXAppExtensionAttributes:EXExtensionPointIdentifier' "$CAPTURE/Info.plist")" = 'com.apple.securecapture'
            test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$CONTROL/Info.plist")" = 'com.apple.widgetkit-extension'
          fi
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$APP" "$RUNNER_TEMP/Payload/Momentra.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/Momentra-unsigned-draft.ipa"
          unzip -t "$RUNNER_TEMP/Momentra-unsigned-draft.ipa"
          lipo -archs "$APP/Momentra"
          shasum -a 256 "$RUNNER_TEMP/Momentra-unsigned-draft.ipa"
      - name: Preserve unsigned candidate for signing
        if: github.ref_name == 'feat/native-camera-control' || github.ref_name == 'feat/native-direct-updates'
        uses: actions/upload-artifact@v4
        with:
          name: momentra-unsigned-camera-control-candidate
          path: ${{ runner.temp }}/Momentra-unsigned-draft.ipa
          if-no-files-found: error
          retention-days: 3
  simulator-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate Xcode project
        working-directory: native-ios
        run: xcodegen generate
      - name: Compile for iOS Simulator
        working-directory: native-ios
        run: xcodebuild -project Momentra.xcodeproj -scheme Momentra -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run native unit tests
        working-directory: native-ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for d in devices if "iPhone" in d["name"]))')
          xcodebuild -project Momentra.xcodeproj -scheme Momentra -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" CODE_SIGNING_ALLOWED=NO test
